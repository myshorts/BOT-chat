name: Phù Cát Weather Nowcast

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nowcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nowcast monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ: Asia/Ho_Chi_Minh
        run: python nowcast.py

      - name: Save state for trend and cooldown tracking
        run: |
          if [ -f .nowcast_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .nowcast_state.json
            git diff --staged --quiet || (git commit -m "chore: update nowcast state [skip ci]" && git push)
          fi
