name: Giao Phúc Weather

on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC = 07:00 giờ VN -> bản tin sáng
    - cron: "*/15 * * * *"   # quét cảnh báo dông / mưa lớn
  workflow_dispatch:
    inputs:
      mode:
        description: "daily hoặc alert"
        default: "daily"

permissions:
  contents: write

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ: Asia/Ho_Chi_Minh
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 0 * * *' && 'daily' || 'alert') }}
        run: python nowcast.py

      - name: Save state
        run: |
          if [ -f .nowcast_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .nowcast_state.json
            git diff --staged --quiet || (git commit -m "chore: update nowcast state [skip ci]" && git pull --rebase && git push)
          fi
